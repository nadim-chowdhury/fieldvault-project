name: fieldvault-dev

services:
  # ─────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fieldvault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldvault
      POSTGRES_PASSWORD: fieldvault_dev_password
      POSTGRES_DB: fieldvault
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldvault -d fieldvault"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fieldvault_network

  # ─────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fieldvault_redis
    restart: unless-stopped
    command: redis-server --requirepass fieldvault_redis_password --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fieldvault_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fieldvault_network

  # ─────────────────────────────────────
  # NestJS API Backend — dev/test
  # ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fieldvault_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldvault}:${POSTGRES_PASSWORD:-fieldvault_dev_password}@postgres:5432/${POSTGRES_DB:-fieldvault}
      REDIS_URL: redis://:${REDIS_PASSWORD:-fieldvault_redis_password}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your_access_secret_min_32_characters_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_refresh_secret_min_32_characters_long}
      APP_URL: http://localhost:${API_PORT:-3001}
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://localhost:${REDIS_COMMANDER_PORT:-8081}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fieldvault_network

  # ─────────────────────────────────────
  # Next.js Web Dashboard — dev/test
  # ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
        NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
    container_name: fieldvault_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your_nextauth_secret_32_characters_long}
      NEXTAUTH_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - fieldvault_network

  # ─────────────────────────────────────
  # Redis Commander (GUI) — dev only
  # Access at http://localhost:8081
  # ─────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: fieldvault_redis_gui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:fieldvault_redis_password"
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fieldvault_network
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

  # ─────────────────────────────────────
  # pgAdmin (GUI) — dev only
  # Access at http://localhost:5050
  # ─────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fieldvault_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fieldvault.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fieldvault_network
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

volumes:
  postgres_data:
    name: fieldvault_postgres_data
  redis_data:
    name: fieldvault_redis_data

networks:
  fieldvault_network:
    name: fieldvault_network
    driver: bridge